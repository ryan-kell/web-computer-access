<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryan — Terminal</title>
  <meta name="description" content="Personal website of Ryan, styled like a Linux terminal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="crt-intro">
    <canvas id="crt-noise" width="160" height="120"></canvas>
    <div class="crt-beam"><canvas id="crt-beam-noise" width="160" height="120"></canvas></div>
    <button class="power" type="button" aria-label="Turn on">
      <span class="power-led"></span>
      <span class="power-label">PRESS POWER</span>
    </button>
    <div class="osd osd-input" id="osd-input">INPUT 1</div>
    <div class="osd osd-sound" role="radiogroup" aria-label="Sound">
      <button type="button" role="radio" data-sound="stereo">STEREO</button>
      <button type="button" role="radio" data-sound="mono">MONO</button>
      <button type="button" role="radio" data-sound="mute">MUTE</button>
    </div>
    <div class="osd osd-hint">
      <span class="hint-keys">◀ ▶ SELECT &nbsp; ENTER OK</span>
      <span class="hint-touch">TAP TO SELECT</span>
    </div>
    <button class="intro-skip" id="intro-skip" type="button">skip intro</button>
  </div>
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="window">
    <div class="titlebar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="titlebar-text" id="title"></span>
    </div>
    <main class="terminal" id="terminal">
      <div id="output" aria-live="polite"></div>
      <div class="input-line">
        <span class="prompt" id="prompt"></span>
        <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input">
      </div>
    </main>
  </div>
  <script src="content.js"></script>
  <script src="sound.js"></script>
  <script src="script.js"></script>
</body>
</html>
